Name: backend
Host: 0.0.0.0
Port: 8080
Timeout: 20000
# 全局请求体上限：500 MiB 文件上限 + 1 MiB multipart 开销余量，
# 与 assetUploadHandler 的 MaxBytesReader 对齐，保证恰好 500 MiB 的包能进入应用层、超限返回明确 413
MaxBytes: 525336576
CertFile:
KeyFile:
Log:
  Mode: file
  Encoding: json
  Path: /app/logs
  Level: info
  Compress: true
  KeepDays: 14
  Rotation: daily

Database:
  UnsDbUrl: ${UNS_DB_URL}
  SinkDbUrl: ${SINK_DB_URL}
Redis:
  Addr: ${REDIS_ADDR}
  Password: ${REDIS_PASSWORD}
  DB: 0
Security:
  JwtSecret: ${JWT_SECRET}
  InitialAdminPassword: ${ADMIN_INITIAL_PASSWORD}
  PluginAPIKey: ${TIER0_API_KEY}
Gateway:
  WebDir: ${WEB_DIR}
  LocalFrontendDev: false
  FrontendDevUrl: ${FRONTEND_DEV_PROXY_URL}
  SourceFlowUrl: ${SOURCEFLOW_URL}
  EventFlowUrl: ${EVENTFLOW_URL}
  EmqxUrl: ${EMQX_URL}
DataIngest:
  Enabled: false
  MqttBrokers: ${DATAINGEST_MQTT_BROKERS}
  MqttClientID: ${DATAINGEST_MQTT_CLIENT_ID}
  MqttUsername: ${DATAINGEST_MQTT_USERNAME}
  MqttPassword: ${DATAINGEST_MQTT_PASSWORD}
  MqttTopic: ${DATAINGEST_MQTT_TOPIC}
  QueueSize: 0
  BatchSize: 0
  FlushIntervalMs: 0
Tier0Sdk:
  ApiHost: ${TIER0_SDK_API_HOST}
  MqttHost: ${TIER0_SDK_MQTT_HOST}
  MqttPort: ${TIER0_SDK_MQTT_PORT}
Storage:
  FileRoot: ${FILESTORE_LOCAL_ROOT}
