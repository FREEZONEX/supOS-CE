Name: backend
Host: 0.0.0.0
Port: 8080
CpuThreshold: 0
Timeout: 20000

Database:
  DBType: pgsql
  DSN: postgres://postgres:postgres@100.100.100.20:31014/postgres
KeycloakDatabase:
  DBType: pgsql
  DSN: postgres://postgres:postgres@100.100.100.20:31014/keycloak2
CacheRedis:
 - Host: localhost:6379
   Pass:
   Type: node
OAuthKeyCloak:
   Realm: ${OAUTH_REALM}
   ClientName: ${OAUTH_CLIENT_NAME}
   ClientID: ${OAUTH_CLIENT_ID}
   ClientSecret: ${OAUTH_CLIENT_SECRET}
   AuthorizationGrantType: ${OAUTH_GRANT_TYPE}
   RedirectURI: ${OAUTH_REDIRECT_URI}
   SuposHome: ${OAUTH_SUPOS_HOME}
   IssuerURI: ${OAUTH_ISSUER_URI}
   # 刷新token的时间 单位：秒 token小于这个时间会调用refreshToken接口刷新
   RefreshTokenTime: ${OAUTH_REFRESH_TOKEN_TIME}