        field:
          type: string
          description: 引用的字段
        uts:
          type: boolean
          description: 是否引用文件的质量码和时间戳，当文件dataType=3计算型时生效，默认为false
    fileVoDetail2:
      type: object
      properties:
        id:
          type: string
          description: ID
        name:
          type: string
          description: 名称
          minLength: 1
          maxLength: 63
        displayName:
          type: string
          description: 显示名
          maxLength: 128
        alias:
          type: string
          description: 别名
        parentAlias:
          type: string
          description: 父级别名
        path:
          type: string
          description: 全路径
        pathName:
          type: string
          description: 路径名
        description:
          type: string
          description: 模型描述
        definition:
          type: array
          description: 字段定义
          items:
            $ref: '#/components/schemas/FieldDefine'
        extendProperties:
          type: object
          additionalProperties:
            type: object
            description: 扩展字段JSON
          description: 扩展属性
          properties: {}
        templateAlias:
          type: string
          description: 关联的模板别名
        updateTime:
          type: integer
          description: 修改时间--单位：毫秒
          format: int64
        createTime:
          type: integer
          description: 创建时间--单位：毫秒
          format: int64
    fileDefinition:
      type: object
      properties:
        key:
          type: string
          description: 文件属性名称
        type:
          type: string
          description: 文件属性类型
        length:
          type: integer
          description: 文件属性长度
        displayName:
          type: string
          description: 文件属性显示名称
        remark:
          type: string
          description: 文件属性备注
        unit:
          type: string
          description: 文件属性单位
        upperLimit:
          type: number
          description: 文件属性量程上限
        lowerLimit:
          type: number
          description: 文件属性量程下限
        decimal:
          type: integer
          description: 文件属性小数位数
        fileName:
          type: string
          description: 所属文件名称
        fileDisplayName:
          type: string
          description: 所属文件显示名称
        fileDescription:
          type: string
          description: 所属文件描述
        fileNameSpace:
          type: string
          description: 所属文件命名空间
        readWriteMode:
          type: string
          description: 所属读写模式 READ_ONLY-只读 READ_WRITE-读写
    TimestampPrecision:
      type: string
      enum: ["s", "ms", "us"]
      default: "ms"
      description: >-
        时间精度，此参数作用于本次响应中的数据时间戳，与其他时间参数如超时时间、采样间隔等无关。可选[s:秒，
        ms:毫秒， us:微秒]，默认毫秒
      example: ''

    Objects:
      description: >-
        用于指定需要查询的「数据对象」及「待返回的属性」，数组中每个元素代表一组查询对象。
        结构规则：
        1. 数组元素：每个元素是一个 Object，键名为「accessId」（数据对象的唯一标识），键值为「属性数组」（指定该对象需返回的属性）。
        2. accessId 含义（数据对象标识）：
          - 位号数据：accessId = 位号别名（如 "temp_sensor_1"）；
          - UNS 文件：accessId = 文件路径（如 "data/device_01.uns"）；
          - 结构化对象属性：accessId = 「对象路径.属性名」（如 "temp_sensor_1.current_value"）；
        3. 属性数组规则（指定需返回的属性）：
          - 空数组 []：返回该 accessId 对应的「所有属性」；
          - ["*"]：效果同空数组，返回所有属性；
          - 具体属性名（如 ["power", "electric"]）：仅返回指定的属性；
      type: array
      items:
        type: object
        additionalProperties:
          type: array
          description: 用以描述该accessId所需要查询的属性
          items:
            type: string
      example: ''

    WriteObjectsResult:
      description: >-
        用于返回查询的「数据对象」及「待返回的属性」的结果，数组中每个元素代表一组查询失败的对象。
      type: array
      items:
        type: object
        properties:
          name:
            $ref: '#/components/schemas/Name'
          code:
            $ref: '#/components/schemas/Code'
      example: ''

    Name:
      type: string
      description: 设备位号别名、设备位号路径、文件别名、文件路径或文件的某个属性
      example: ''

    Code:
      type: number
      description: 0 表示成功，非0 表示失败。成功时不需要判断objects中的内容，如果失败，objects中有所有失败的信息。如果失败，但是objects为空，说明全部失败（请求异常场景）。
      example: 0

    Message:
      type: string
      description: 请求结果code的文本描述，可用于显示或问题定位
      example: ''

    ResultType:
      type: string
      description: 当前结果对应的聚合方法(仅聚合)
      example: ''

    ResponseDatas:
      description: ''
      type: array
      items:
        type: object
        properties:
          name:
            $ref: '#/components/schemas/Name'
          code:
            $ref: '#/components/schemas/Code'
          resultType:
            $ref: '#/components/schemas/ResultType'
          values:
            $ref: '#/components/schemas/NamedValueArray'

    QueryTimes:
      description: ''
      type: array
      items:
        type: string
      example: ''

    Interval:
      type: number
      description: 采样/统计间隔，时间精度是微秒
      example: '0'

    Reverse:
      description: 用于查询结果按时间戳的排序：0(默认值) - 按时间戳升序；1 - 按时间戳降序
      enum: [0, 1]
      default: 0
      example: '0'

    Interpolation:
      type: number
      description: 插值策略:0(默认值) - 前值; 2 - 线性插值
      enum: [0, 2]
      default: 0
      example: '0'

    Method:
      type: number
      description: 聚合的方法,first：区间第一个值;max：区间内最大值
      example: '0'

    DataCount:
      type: number
      description: 期望获得结果的数量。一次请求中，最多支持10万数据。批量查询时，则平均至单个位号或文件属性。
      example: '0'

    TimeOut:
      type: number
      description: 请求超时时间, 请求超时时间, 默认是微秒
      example: '0'

    NamedValueArray:
      type: array
      items:
        $ref: '#/components/schemas/NamedValueItem'

    NamedValueItem:
      type: object
      required:
        - name
        - value
      properties:
        name:
          type: string
          description: 名称标识
        value:
          oneOf:
            # 情况1：除了timeStamp 和 status外只有 value属性
            - type: object
              allOf:
                - required: [timeStamp, status, value]
                  properties:
                    timeStamp:
                      type: number
                      description: 时间戳
                    status:
                      type: number
                      description: 质量码
                    value:
                      description: 可选的附加值（任意类型）
                      oneOf:
                        - type: string
                        - type: integer
                        - type: boolean
                        - type: object
                        - type: number
              additionalProperties: false  # 禁止其他属性

            # 情况2：除了timeStamp 和 status，存在value以外的其他属性
            - type: object
              required: [timeStamp, status]
              properties:
                timeStamp:
                  type: number
                  description: 时间戳
                status:
                  type: number
                  description: 质量码
              # 允许额外属性，如 electric, power 等
              additionalProperties: true

    #组态服务schemas定义
    DeviceDetail:
      description: 设备信息
      type: object
      properties:
        uuid:
          type: string
          maxLength: 1024
          minLength: 1
          description: 设备的uuid，全局唯一
          example: 203af090-f99d-11ef-b2fa-87a1e1ed6681
        alias:
          type: string
          maxLength: 1024
          minLength: 1
          description: 设备名称，唯一标识，不可重复
          example: col1
        displayName:
          type: string
          maxLength: 1024
          minLength: 0
          description: 设备的显示名称
          example: 采集器1
        description:
          type: string
          maxLength: 1024
          minLength: 0
          description: 设备描述
          example: 采集器1
        owner:
          type: string
          maxLength: 1024
          minLength: 0
          description: 设备责任人
          example: 张三
        companyAddress:
          type: string
          maxLength: 1024
          minLength: 0
          description: 公司地址
          example: 浙江省杭州市
        companyName:
          type: string
          maxLength: 1024
          minLength: 0
          description: 公司名字
          example: xxxx公司
        type:
          type: string
          description: |
            按设备类型查询设备，仅支持单类型。
            设备类型, 与返回的type字段一致：
              * supCollector    -- 时序数据采集器
              * StdDataService  -- 时序库连接器
              * GRPC            -- GRPC网关
              * IoT             -- IOT网关，接入MQTT
              * AECollector     -- 报警采集器
              * simuCollector   -- 模拟采集器
              * videoCollector  -- 视频采集器
              * Node-Red        -- Node-Red接入
              * NeuroLink       -- NeuroLink设备
          enum:
            - supCollector
            - StdDataService
            - GRPC
            - IoT
            - Node-Red
            - AECollector
            - simuCollector
            - videoCollector
            - NeuroLink
          example: simuCollector
        source:
          type: string
          description: |
            设备来源，仅对Node-Red生效。
              * inside    -- 内置
              * outside   -- 外置
          enum:
            - inside
            - outside
          example: inside
        timestampType:
          type: string
          description: |
            设备时间戳类型： 
             * server    -- 服务器时间戳
             * collector -- 设备时间戳
          enum:
            - server
            - collector
          example: collector
        state:
          type: string
          description: |
            description: |
              设备状态 
                * online      -- 在线
                * offline     -- 离线
                * needAccess  -- 待接入
                * needReplace -- 待替换
          enum:
            - online
            - offline
            - needAccess
            - needReplace
          example: needAccess
        encrypt:
          type: boolean
          description: 是否加密。TSDCollector和AECollector可用
          example: false
        secretKey:
          type: string
          maxLength: 4096
          minLength: 0
          description: 私钥。
          example: RSA-256 XXXX
        publicKey:
          type: string
          maxLength: 4096
          minLength: 0
          description: 公钥。
          example: RSA-256 public XXXX
        ip:
          type: string
          maxLength: 1024
          minLength: 0
          description: 设备的ip地址。
          example: "192.168.1.2"
        port:
          type: string
          maxLength: 1024
          minLength: 0
          description: 设备端口
          example: "42870"
        fullSync:
          type: boolean
          description: 全量同步，StdDataService可用
          example: false
        offlineTimeout:
          type: integer
          format: int32
          description: 设备无数据超时离线时间，IOT可用。单位为毫秒
          example: 300
        offlineTimeoutUnit:
          type: string
          description: 设备超时离线时间单位，IOT可用。
          example: s
        storageResource:
          type: string
          maxLength: 1024
          minLength: 0
          description: 存储资源，AECollector可用
          example: dhb_col_ae9181
        redundant:
          type: boolean
          description: 是否冗余
          example: false
        deviceGroup:
          type: string
          maxLength: 1024
          minLength: 0
          description: 设备分组的alias。
          example: 203af090-f99d-11ef-b2fa-87a1e1ed1235
        deviceVersion:
          type: string
          maxLength: 1024
          minLength: 0
          description: 设备版本。
          example: v1
        redundantInfo:
          type: array
          description: 冗余信息
          items:
            type: object
            properties:
              ip:
                type: string
                maxLength: 1024
                minLength: 1
                description: 冗余信息ip
                example: 127.0.0.1
              port:
                type: string
                maxLength: 1024
                minLength: 1
                description: 端口
                example: 8080
              state:
                type: string
                maxLength: 1024
                minLength: 1
                description: |
                  运行状态：
                  * online    - 在线
                  * offline   - 离线
                  * ready     - 备用
                enum:
                  - online
                  - offline
                  - ready
              version:
                type: string
                maxLength: 1024
                minLength: 1
                description: 采集器的组态版本
                example: v123
        tagCount:
          type: integer
          format: int32
          description: 位号数量
          example: 50001
        endpointId:
          type: string
          maxLength: 1024
          minLength: 0
          description: 已接入的endpoint
          example: xxxx-xxxx-xxxx
        mountPath:
          type: string
          maxLength: 1024
          minLength: 0
          description: 自动挂载的uns父级文件夹别名，适用于NeuroLink设备
          example: _dir_727df29615b246b08af6
        version:
          $ref: '#/components/schemas/VersionInfo'

    VersionInfo:
      type: object
      description: 版本信息
      properties:
        versionId:
          type: integer
          format: int32
          description: 版本ID，最新的变化版本
          example: 10
        versionUuid:
          type: string
          description: 版本的UUID，版本的唯一标识
          maxLength: 1024
          minLength: 0
          example: 0fa1738f-0cef-4759-99f1-e6aad51485f8
        modifyTime:
          type: integer
          format: int64
          description: 修改时间，服务器基准的utc时间，单位为秒
          example: 1741338386
        createVersion:
          type: integer
          format: int32
          description: 创建版本ID
          example: 9
        createTime:
          type: integer
          format: int64
          description: 创建时间，服务器基准的utc时间，单位为秒
          example: 1741337386

    ResultError:
      type: object
      properties:
        code:
          type: integer
          format: uint32
          description: |
            业务的错误码
              * 0x00000000 -- 成功
              * 0x00300000 -- 写值专用，用于表示下写的值已经被接受，但被钳制	
              * 0x002d0000 -- 订阅已经被转移，用于服务器切换时，订阅客户端向外发起通知
              * 0x002e0000 -- 操作结果将会异步完成。异步写值时将返回这个结果
              * 0x00b20000 -- 表示成功，但等待最终的结果，用于中间结果的通知
              * 0x00ba0000 -- 已经成功，但本次结果是不完整的
              * 0x00a50000 -- 没有数据
              * 0x00a60000 -- 还有数据
              * 0x80000000 -- 通用错误码，无扩展含义，不建议使用
              * 0x80010000 -- 未预期的错误，不建议使用
              * 0x80020000 -- 内部错误，需要扩展使用,使用时附加模块号
              * 0x80030000 -- 内存不足
              * 0x80050000 -- 通信故障
              * 0x80060000 -- 编码错误
              * 0x80070000 -- 解码错误，客户端解码错误或服务端对接收到的消息进行解码发生错误后，可用此错误码返回	
              * 0x800a0000 -- 超时，客户端等待服务器反馈超时时使用
              * 0x800b0000 -- 服务器不支持客户端所请求的服务
              * 0x800d0000 -- 未连接到服务器，客户端在未连接到服务器时，应用调用了其他访问数据的接口时，使用此错误码返回
              * 0x80110000 -- 未知的数据类型
              * 0x80230000 -- 服务器接收到客户端请求的时间标签错误
              * 0x80250000 -- 非法的客户端id，当调用接口时，检测到传入的clientid非法时返回
              * 0x80270000 -- 客户端未登录，当调用接口时，客户端dll发现未登录到服务器时返回
              * 0x80260000 -- 客户端已登出，当调用接口时，客户端dll发现已经从服务器登出时返回此错误码
              * 0x80340000 -- 未知位号，即位号不存在
              * 0x803a0000 -- 位号不可读
              * 0x803b0000 -- 位号只读，不支持写操作
              * 0x803c0000 -- 值越界，超出了量程范围，目前用于写值时超量程时返回错误
              * 0x803d0000 -- 不支持，对某项功能不支持，服务器端建议使用BS_Error_ServiceUnsupported
              * 0x803e0000 -- 未找到，当查询位号未找到或订阅分组未找到时，返回此错误	
              * 0x80400000 -- 未实现，更多的建议在接口层面使用，某些接口在sdk中未实现	
              * 0x805a0000 -- 请求已经被客户端取消，如查询中，中断查询时返回此错误码
              * 0x80740000 -- 类型错误，用于写值时接受到数据类型与位号组态的数据类型不匹配
              * 0x807d0000 -- 服务器过于忙碌，当请求超过服务器限值时返回此错误码
              * 0x80890000 -- 组态错误，导致无法操作
              * 0x808d0000 -- 不提供服务，用于位号无授权时返回
              * 0x809b0000 -- 没有数据
              * 0x80ab0000 -- 参数错误，属于参数类的通用错误，查询或订阅中有定义更详细的错误，只有未找到更详细的错误码时使用此错误码
              * 0x80ad0000 -- 已经与服务器断开连接
              * 0x80b20000 -- 等待结果返回
              * 0x80b50000 -- 操作未结束，被堵塞	
              * 0x80b70000 -- 连接数已经达到系统支持的最大数
              * 0x80b80000 -- 请求过大，服务端接收到请求之后判断出需要申请的内存过大时，可以使用此错误码返回
              * 0x80b90000 -- 客户端接收到服务端反馈，判断出需要申请的内存过大时，可以使用此错误码返回
              * 0x80be0000 -- 协议版本不知道，当客户端和服务器协议版本不匹配时返回此错误码
              * 0x80020001 -- 服务已连接	
              * 0x80020002 -- 已经存在
              * 0x80db0000 -- 客户端订阅位号数量超过了最大限制
