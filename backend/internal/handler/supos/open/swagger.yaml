                  default: 0
                  description: >-
                    在系统运行过程中，除数据源外，采集服务、实时数据服务、存档服务都可能会产生数据，实时数据服务、存档数据在检测到数据源断开和系统退出时会自动存储一个bad点。查询方法提供了数据来源进行过滤的功能：0（默认值）- 所有数据。 1 - 仅数据源数据
                  example: '0'
                valueStrategy:
                  type: number
                  enum: [0, 1]
                  description: 结果中v的策略：该参数仅对lblob类型生效：0（默认值）- 返回vqst。 1 - 返回qst
                  example: '0'
                dataCount:
                  $ref: '#/components/schemas/DataCount'
                timeOut:
                  $ref: '#/components/schemas/TimeOut'
            examples:
              rawRequestExample:
                $ref: '#/components/examples/RawRequestExample'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
                  code:
                    $ref: '#/components/schemas/Code'
                  datas:
                    $ref: '#/components/schemas/ResponseDatas'
              examples:
                responseExample:
                  $ref: '#/components/examples/CommonResponseExample'
          headers: {}
      security: []
components:
  parameters:
    ContentTypeHeader:
      name: Content-Type
      in: header
      description: 请求内容类型
      required: true
      schema:
        type: string
        example: application/json
    AuthorizationHeader:
      name: Authorization
      in: header
      description: ''
      required: true
      example: xxxx
      schema:
        type: string
  schemas:
    ResultVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: 状态码 200-成功 400-参数错误 500-接口异常
        msg:
          type: string
          description: 响应消息
        data:
          type: object
          properties: {}
          description: 响应数据
    FieldDefine:
      required:
        - name
        - type
      type: object
      properties:
        name:
          type: string
          description: 字段名：字母开头，支持字母、数字和下划线，最长63
        type:
          type: string
          description: 字段类型：INTEGER, LONG, FLOAT, DOUBLE, BOOLEAN, DATETIME, STRING
        unique:
          type: boolean
          description: 是否唯一约束，新建模板时，此参数不生效
        index:
          type: string
          description: 对应的协议字段key，新建模板时，此参数不生效
        displayName:
          type: string
          description: 显示名
        remark:
          type: string
          description: 备注
        maxLen:
          type: integer
          description: 最大长度(string字段类型生效)
          format: int32
        systemField:
          type: boolean
          description: 是否系统参数，新建模板时，此参数不生效
        unit:
          type: string
          description: 位号单位 最长5
        upperLimit:
          type: number
          description: 里程上限
        lowerLimit:
          type: number
          description: 里程下限
        decimal:
          type: integer
          description: 小数精度位数
      description: 新增的字段
    InstanceDetail:
      type: object
      properties:
        id:
          type: string
          description: 文件ID
        name:
          type: string
          description: 文件名
        displayName:
          type: string
          description: 显示名
        alias:
          type: string
          description: 别名
        parentAlias:
          type: string
          description: 父级别名
        path:
          type: string
          description: 全路径
        dataType:
          type: integer
          description: 1--时序，2--关系，3--计算型, 6--聚合 7--引用
          format: int32
        pathType:
          type: integer
          description: 文件类型 0--文件夹，2--文件
          format: int32
        definition:
          type: array
          description: 字段定义
          items:
            $ref: '#/components/schemas/FieldDefine'
        description:
          type: string
          description: 描述
        persistence:
          type: boolean
          description: 是否持久化
        expression:
          type: string
          description: 表达式，引用用 id
        frequency:
          type: string
          description: 聚合计算频率：当聚合类型时(dataType=6)的计算时间间隔，单位支持：秒:s 分钟:m 小时：h；如三分钟：3m
        showExpression:
          type: string
          description: 用于展示的表达式，引用用 path
        refers:
          type: array
          description: 引用对象
          items:
            $ref: '#/components/schemas/refres'
        pathName:
          type: string
          description: 文件路径名
        templateAlias:
          type: string
          description: 引用的模板别名
        extendProperties:
          type: object
          additionalProperties:
            type: object
            description: 扩展字段JSON
          description: 扩展属性
          properties: {}
        updateTime:
          type: integer
          description: 修改时间--单位：毫秒
          format: int64
        createTime:
          type: integer
