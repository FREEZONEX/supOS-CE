  /os/open-api/uns/pride/task/import:
    post:
      summary: 批量创建（增量）PRIDE拓扑任务
      deprecated: false
      description: ''
      operationId: prideUnsImport
      tags:
        - Pride
      parameters:
        - name: rootAlias
          in: query
          description: 为该拓扑的根文件夹别名，body中的顶层节点应该创建在该目录下
          required: false
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                instances:
                  type: array
                  items:
                    type: object
                    properties:
                      attributeValues:
                        type: array
                        items:
                          type: object
                          properties:
                            attributeName:
                              description: 扩展属性键
                              type: string
                            attributeNamespace:
                              type: string
                            attributeValue:
                              description: 扩展属性值
                              type: string
                        description: 文件夹扩展属性键值对集合,最多三个
                      attributes:
                        type: array
                        items:
                          type: object
                          properties:
                            attributes:
                              type: array
                              items:
                                type: string
                            bindSourceInstanceEnName:
                              description: 属性所关联的采集器别名
                              type: string
                            children:
                              type: array
                              items:
                                type: string
                            dataType:
                              description: 属性值数据类型
                              type: string
                            defaultValue:
                              description: 属性默认值（初始值），仅针对静态属性
                              type: string
                            description:
                              description: 属性描述
                              type: string
                            displayName:
                              description: 属性名称
                              type: string
                            enName:
                              description: 属性别名
                              type: string
                            needToCreateBindRelation:
                              description: 是否为动态属性（无该字段则或为true时表示动态属性，为false时表示静态属性）
                              type: boolean
                            templateFullName:
                              type: string
                          required:
                            - attributes
                            - bindSourceInstanceEnName
                            - children
                            - dataType
                            - description
                            - displayName
                            - enName
                            - templateFullName
                        description: 当前文件夹下文件集合
                      bindSourceInstanceEnName:
                        description: 文件及所对应的采集器别名
                        type: string
                      children:
                        type: array
                        items:
                          type: string
                        description: 子文件夹集合
                      description:
                        description: 文件夹描述
                        type: string
                      displayName:
                        description: 文件夹名称
                        type: string
                      enName:
                        description: 文件夹别名
                        type: string
                      templateFullName:
                        description: 文件夹模版别名
                        type: string
                    required:
                      - displayName
                      - enName
              required:
                - instances
            example:
              instances:
                - attributes:
                    - attributes: []
                      bindSourceInstanceEnName: collect_not_exist
                      children: []
                      dataType: DOUBLE
                      description: 这是动态位号，即引用位号，在这个json中，动态即引用类型
                      displayName: 浮点数1
                      enName: double1
                      templateFullName: system.PRIDESIMTemplate
                  bindSourceInstanceEnName: collect_not_exist
                  children: []
                  description: ''
                  displayName: AI001
                  enName: S8f7f6eee4bdb41a5a3ae72907e9de4dd
                  templateFullName: PRIDESIMTemplate
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  taskId:
                    type: string
                    description: 任务ID
                  createdTime:
                    type: string
                    description: 任务开始时间
                  finishedTime:
                    type: string
                    description: 任务结束时间
                  status:
                    description: '-1:执行失败，0:执行中，1:执行成功'
                    type: integer
                  message:
                    type: string
                required:
                  - taskId
                  - createdTime
                  - finishedTime
                  - status
                  - message
              example:
                taskId: 3e4846587ffb4387930a1aff5b5cade3
                createdTime: '2024-09-18T07:40:00Z'
                finishedTime: ''
                status: 0
                message: ''
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
