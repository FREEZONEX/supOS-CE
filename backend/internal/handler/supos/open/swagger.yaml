  /os/open-api/uns/history/v3/aggregation:
    post:
      summary: 聚合查询
      operationId: historyAggregation
      deprecated: false
      description: ''
      tags:
        - 历史服务
      parameters:
        - $ref: '#/components/parameters/ContentTypeHeader'
        - $ref: '#/components/parameters/AuthorizationHeader'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                timeOffset:
                  type: number
                  description: >-
                    时间窗口偏移，单位是微秒。比如，查询开始时间2025-08-01T00:00:00Z，统计间隔为10分钟，在没有指定时间偏移时，统计周期依次为["2025-08-01T00:00:00Z", "2025-08-01T00:10:00Z")，["2025-08-01T00:10:00Z", "2025-08-01T00:20:00Z")... 如指定时间偏移1分钟（60000000），则统计周期依次["2025-08-01T00:01:00Z", "2025-08-01T00:11:00Z")，["2025-08-01T00:11:00Z", "2025-08-01T00:21:00Z") ... 需要注意，统计的结束时间是不会偏移的，这一般意味着最后一个区间的时间会少于之前的区间。
                  example: '0'
                queryTimes:
                  description: >-
                    查询的起止时间段，采用ISO8601标准的字符串，比如"2025-08-25T10:00:00Z"或者"2025-08-25T18:00:00+08:00"。当前不支持指定时间边界是否含，总是默认前闭后开。
                  type: array
                  minItems: 2
                  maxItems: 2
                  items:
                    type: string
                  example: ''
                objects:
                  $ref: '#/components/schemas/Objects'
                timestampPrecision:
                  $ref: '#/components/schemas/TimestampPrecision'
                reverse:
                  $ref: '#/components/schemas/Reverse'
                interpolation:
                  $ref: '#/components/schemas/Interpolation'
                method:
                  type: array
                  description: 聚合的方法，数组，支持指定多个，如["first", "max"],first：区间第一个值;max：区间内最大值
                  items:
                    type: string
                    enum: ["first", "last", "min", "max", "acv", "arm", "inv", "inm", "convar", "devar", "allEvents", "changEvents"]
                    minItems: 1
                    maxItems: 12
                    description: |
                      first: 区间的第一个数据
                      last: 区间的最后一个数据
                      max: 区间的最大值
                      min: 区间的最小值
                      acv: 区间的累加值
                      arm: 区间的累加平均值
                      inv: 区间的积分值
                      inm: 区间的积分平均值
                      convar: 区间的连续方差
                      devar: 区间的离散方差
                      allEvents: 区间内所有的数据点数量
                      changeEvents: 区间内数据发生变化的次数
                  example: '0'
                dataCount:
                  $ref: '#/components/schemas/DataCount'
                timeOut:
                  $ref: '#/components/schemas/TimeOut'
            examples:
              aggRequestExample:
                $ref: '#/components/examples/AggRequestExample'
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    $ref: '#/components/schemas/Message'
                  code:
                    $ref: '#/components/schemas/Code'
                  datas:
                    $ref: '#/components/schemas/ResponseDatas'
              examples:
                responseExample:
                  $ref: '#/components/examples/AggResponseExample'
          headers: {}
      security: []

