                          type: string
                        templateAlias:
                          description: 模版别名
                          type: string
                        createTime:
                          description: 创建时间
                          type: integer
                        updateTime:
                          description: 更新时间
                          type: integer
                        countChildren:
                          description: 包含文件个数
                          type: integer
                        extend:
                          type: object
                          properties:
