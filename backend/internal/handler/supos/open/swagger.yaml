      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                parentId:
                  description: 指定根文件夹ID。如果和parentAlias同时存在，则parentAlias参数输入无效。
                  type: string
                parentAlias:
                  description: 指定根文件夹别名。如果为空表示查询全部
                  type: string
                returnParentInfo:
                  description: >-
                    返回数据是否包含parentId/parentAlias中指定的文件夹信息。ture-包含该信息（默认值），false-不包含该信息。
                  type: boolean
                deep:
                  description: 查询深度。-1为默认值，表示全深度；1表示1层，以此类推。
                  type: integer
                displayName:
                  description: 指定文件夹显示名称。模糊匹配
                  type: string
                templateAlias:
                  description: 指定模版别名。精确匹配
                  type: string
                description:
                  description: 文件夹描述。模糊匹配
                  type: string
                createStartTime:
                  description: 文件夹创建起始时间。使用RFC3339格式查询。
                  type: string
                createEndTime:
                  description: 文件夹创建结束时间。使用RFC3339格式查询。
                  type: string
                updateStartTime:
                  description: 文件夹更新起始时间。使用RFC3339格式查询。
                  type: string
                updateEndTime:
                  description: 文件夹更新结束时间。使用RFC3339格式查询。
                  type: string
                extend:
                  type: object
                  properties:
                    k1:
                      type: string
                    k2:
                      type: string
                  required:
                    - k1
                    - k2
                  description: 指定查询扩展Attribute。精确匹配
            example: "{\r\n    \"parentId\":\"1920748106279301120\",\r\n    \"parentAlias\":\"SXXXXXXXXXXX\",\r\n    \"returnParentInfo\":true,\r\n    \"deep\":-1,\r\n    \"displayName\":\"PADIMView\",\r\n    \"templateAlias\":\"SDM_FieldData_PRIDESIMTemplate\",\r\n    \"description\":\"\",\r\n    \"createStartTime\":\"2024-09-18T07:40:00Z\",\r\n    \"createEndTime\":\"2024-09-18T07:40:00Z\",\r\n    \"updateStartTime\":\"2024-09-18T07:40:00Z\",\r\n    \"updateEndTime\":\"2024-09-18T07:40:00Z\",\r\n    \"extend\":{\r\n        \"k1\":\"k1\", \"k2\":\"v2\"},\r\n}"
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                  msg:
                    type: string
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        pathType:
                          description: '*节点类型。0-文件夹，2-文件'
                          type: integer
                        displayName:
                          description: '*文件夹显示名。'
                          type: string
                        name:
                          description: '*文件夹名，'
                          type: string
                        alias:
                          description: 文件夹别名。
                          type: string
                        id:
                          description: 文件夹ID（LONG的字符串表示）。
                          type: string
                        parentAlias:
                          description: 所属父文件夹别名。
                          type: string
                        description:
