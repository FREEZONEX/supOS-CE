openapi: 3.0.1
info:
  title: “工业元”建模
  description: ''
  version: 1.0.0
tags:
  - name: 文件夹/文件管理
  - name: 模板管理
  - name: 标签管理
  - name: Pride
paths:
  /os/open-api/uns/folder/schema:
    get:
      summary: 查询文件夹schema 元数据结构
      deprecated: false
      description: 文件夹schema 定义结构
      tags:
        - 文件夹/文件管理
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security: []
  /os/open-api/uns/file/schema:
    get:
      summary: 查询文件schema 元数据结构
      deprecated: false
      description: 文件夹schema 定义结构
      tags:
        - 文件夹/文件管理
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
                properties: {}
          headers: {}
      security: []
  /os/open-api/uns/folder/{alias}:
    get:
      summary: 别名查询文件夹详情
      deprecated: false
      description: 根据文件夹别名查询文件夹详细信息。
      operationId: getModelDefinition
      tags:
        - 文件夹/文件管理
      parameters:
        - name: alias
          in: path
          description: 别名
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 错误码，200--正常，其他失败
                    format: int32
                  msg:
                    type: string
                    description: 错误信息
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID
                      name:
                        type: string
                        description: 名称
                        minLength: 1
                        maxLength: 63
                      displayName:
                        type: string
                        description: 显示名
                        maxLength: 128
                      alias:
                        type: string
                        description: 别名
                      parentAlias:
                        type: string
                        description: 父级别名
                      path:
                        type: string
                        description: 全路径
                      pathName:
                        type: string
                        description: 路径名
                      description:
                        type: string
                        description: 模型描述
                      definition:
                        type: array
                        description: 字段定义
                        items:
                          $ref: '#/components/schemas/FieldDefine'
                      extendProperties:
                        type: object
                        additionalProperties:
                          type: object
                          description: 扩展字段JSON
                        description: 扩展属性
                        properties: {}
                      templateAlias:
                        type: string
                        description: 关联的模板别名
                      updateTime:
                        type: integer
                        description: 修改时间--单位：毫秒
                        format: int64
                      createTime:
                        type: integer
                        description: 创建时间--单位：毫秒
                        format: int64
                required:
                  - data
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
  /os/open-api/uns/file/{alias}:
    get:
      summary: 别名查询文件详情
      deprecated: false
      description: 根据文件别名查询文件详细信息。
      operationId: getInstanceDetail
      tags:
        - 文件夹/文件管理
      parameters:
        - name: alias
          in: path
          description: 别名
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 63
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 错误码，0--正常，其他失败
                    format: int32
                  msg:
                    type: string
                    description: 错误信息
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: 文件ID
                      name:
                        type: string
                        description: 文件名
                      displayName:
                        type: string
                        description: 显示名
                      alias:
                        type: string
                        description: 别名
                      parentAlias:
                        type: string
                        description: 父级别名
                      path:
                        type: string
                        description: 全路径
                      dataType:
                        type: integer
                        description: 1--时序，2--关系，3--计算型, 6--聚合 7--引用
                        format: int32
                      pathType:
                        type: integer
                        description: 文件类型 0--文件夹，2--文件
                        format: int32
                      definition:
                        type: array
                        description: 字段定义
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                              description: 字段名：字母开头，支持字母、数字和下划线 最长63
                            type:
                              type: string
                              description: >-
                                字段类型：INTEGER, LONG, FLOAT, DOUBLE, BOOLEAN,
                                DATETIME, STRING
                            unique:
                              type: boolean
                              description: 是否唯一约束，新建模板时，此参数不生效
                            index:
                              type: string
                              description: 对应的协议字段key，新建模板时，此参数不生效
                            displayName:
                              type: string
                              description: 显示名
                            remark:
                              type: string
                              description: 备注
                            maxLen:
                              type: integer
                              description: 最大长度(string字段类型生效)
                              format: int32
                            systemField:
                              type: boolean
                              description: 是否系统参数，新建模板时，此参数不生效
                            unit:
                              type: string
                              description: 位号单位 最长5
                            upperLimit:
                              type: number
                              description: 里程上限
                            lowerLimit:
                              type: number
                              description: 里程下限
                            decimal:
                              type: integer
                              description: 小数精度位数
                          required:
                            - name
                            - type
                      description:
                        type: string
                        description: 描述
                      persistence:
                        type: boolean
                        description: 是否持久化
                      expression:
                        type: string
                        description: 表达式，引用用 id
                      frequency:
                        type: string
                        description: >-
                          聚合计算频率：当聚合类型时(dataType=6)的计算时间间隔，单位支持：秒:s 分钟:m
                          小时：h；如三分钟：3m
                      showExpression:
                        type: string
                        description: 用于展示的表达式，引用用 path
                      refers:
                        type: array
                        description: 引用对象
                        items:
                          $ref: '#/components/schemas/refres'
                      pathName:
                        type: string
                        description: 文件路径名
                      templateAlias:
                        type: string
                        description: 引用的模板别名
                      extendProperties:
                        type: object
                        additionalProperties:
                          type: object
                          description: 扩展字段JSON
                        description: 扩展属性
                        properties: {}
                      updateTime:
                        type: integer
                        description: 修改时间--单位：毫秒
                        format: int64
                      createTime:
                        type: integer
                        description: 创建时间--单位：毫秒
                        format: int64
                    required:
                      - frequency
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
  /os/open-api/uns/folder/byPath:
    get:
      summary: 路径查询文件夹详情
      deprecated: false
      description: 根据路径查询文件夹详细信息。
      operationId: folderDetailByPath
      tags:
        - 文件夹/文件管理
      parameters:
        - name: path
          in: query
          description: ''
          required: false
          example: 路径
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 错误码，200--正常，其他失败
                    format: int32
                  msg:
                    type: string
                    description: 错误信息
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: ID
                      alias:
                        type: string
                        description: 别名
                      parentAlias:
                        type: string
                        description: 父级别名
                      path:
                        type: string
                        description: 全路径
                      definition:
                        type: array
                        description: 字段定义
                        items:
                          $ref: '#/components/schemas/FieldDefine'
                      description:
                        type: string
                        description: 模型描述
                      name:
                        type: string
                        description: 名称
                      displayName:
                        type: string
                        description: 显示名
                      pathName:
                        type: string
                        description: 路径名
                      extendProperties:
                        type: object
                        additionalProperties:
                          type: object
                          description: 扩展字段JSON
                        description: 扩展属性
                        properties: {}
                      templateAlias:
                        type: string
                        description: 关联的模板别名
                      updateTime:
                        type: integer
                        description: 修改时间--单位：毫秒
                        format: int64
                      createTime:
                        type: integer
                        description: 创建时间--单位：毫秒
                        format: int64
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
  /os/open-api/uns/file/byPath:
    get:
      summary: 路径查询文件详情
      deprecated: false
      description: 根据路径查询文件详细信息。
      operationId: fileDetailByPath
      tags:
        - 文件夹/文件管理
      parameters:
        - name: path
          in: query
          description: ''
          required: false
          example: 路径
          schema:
            type: string
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 错误码，0--正常，其他失败
                    format: int32
                  msg:
                    type: string
                    description: 错误信息
                  data:
                    $ref: '#/components/schemas/InstanceDetail'
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
  /os/open-api/uns/file:
    post:
      summary: 创建文件
      deprecated: false
      description: 创建文件，不支持批量创建！
      operationId: createFile
      tags:
        - 文件夹/文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 文件夹名称，仅支持中文、字母、数字、下划线（_）和连字符（-），最大长度63
                  minLength: 1
                  maxLength: 63
                alias:
                  type: string
                  description: 文件别名，最大长度63字符，允许字符包括英文、数字、下划线。为空则系统自动生成
                  maxLength: 63
                displayName:
                  description: 文件显示名，最大长度128字符
                  type: string
                parentAlias:
                  type: string
                  description: 父级文件夹别名，为空表示顶级
                  maxLength: 63
                dataType:
                  description: 1-时序，2-关系，3-实时计算（仅支持函数计算方式），6-聚合，7-引用。
                  type: integer
                description:
                  type: string
                  description: 文件描述
                  maxLength: 255
                definition:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 字段名：字母开头，支持字母、数字和下划线 最长63
                        minLength: 1
                        maxLength: 63
                      type:
                        type: string
                        description: >-
                          字段类型：INTEGER, LONG, FLOAT, DOUBLE, BOOLEAN, DATETIME,
                          STRING
                      unique:
                        type: boolean
                        description: 是否唯一约束
                      displayName:
                        type: string
                        description: 显示名
                      remark:
                        type: string
                        description: 备注
                      maxLen:
                        type: integer
                        description: 最大长度(string字段类型生效)
                      unit:
                        type: string
                        description: 位号单位
                        maxLength: 32
                      upperLimit:
                        type: number
                        description: 原始上限
                        maximum: 20
                      lowerLimit:
                        type: number
                        description: 原始下限
                        maximum: 20
                      decimal:
                        type: integer
                        description: 小数精度位数
                        maximum: 10
                    required:
                      - name
                      - type
                  description: 字段定义，dataType为：1、2、3时必填
                persistence:
                  description: 是否持久化 默认false
                  type: boolean
                refers:
                  type: array
                  items:
                    properties:
                      alias:
                        type: string
                        description: 引用的文件别名
                      field:
                        type: string
                        description: 引用的字段 当dataType为计算时，必填
                      variableName:
                        type: string
                        description: 计算文件使用的变量名，按a1、a2依次顺延
                    type: object
                    required:
                      - alias
                  description: 引用对象 当dataType为计算、聚合、引用时必填
                expression:
                  type: string
                  description: >-
                    当dataType=3时可指定表达式，a1表示refers中第一个，a2表示第二个，以此类推。允许为空或无该字段，表示暂无表达式，此时可按照1-时序的特性来处理。
                  maxLength: 255
                frequency:
                  type: string
                  description: 聚合计算频率：当聚合类型时(dataType=6)的计算时间间隔，单位支持：秒:s 分钟:m 小时：h；如三分钟：3m
                  maxLength: 10
                extendProperties:
                  type: object
                  properties:
                    k1:
                      type: string
                    k2:
                      type: string
                  description: 文件扩展Attributes 最大支持3个
                  required:
                    - k1
                    - k2
                  maxProperties: 3
                templateAlias:
                  type: string
                  description: 关联的模板别名
                  maxLength: 63
                labelNames:
                  type: array
                  items:
                    type: string
                  description: 标签名称数组，支持创建文件时打标签
              required:
                - name
                - dataType
            examples: {}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 状态码 200-成功 400-参数错误 500-接口异常
                  msg:
                    type: string
                    description: 响应消息
                  data:
                    type: object
                    properties: {}
                    description: 响应数据
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
  /os/open-api/uns/folder:
    post:
      summary: 创建文件夹
      deprecated: false
      description: 创建文件夹信息，不支持批量创建!
      operationId: createFolder
      tags:
        - 文件夹/文件管理
      parameters: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 文件夹名称，仅支持中文、字母、数字、下划线（_）和连字符（-），最大长度63
                  maxLength: 63
                alias:
                  type: string
                  description: 文件夹别名，仅支持字母、数字、下划线（_），不能以数字开头，最大长度63。为空时系统自动生成
                  maxLength: 63
                displayName:
                  type: string
                  description: 文件夹显示名称，最大长度128
                  maxLength: 128
                parentAlias:
                  type: string
                  description: 父级文件夹别名，为空表示顶级
                  maxLength: 63
                description:
                  type: string
                  description: 文件夹描述，最大长度255
                  maxLength: 255
                definition:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 字段名：字母开头，支持字母、数字和下划线 最长63
                        maxLength: 63
                      type:
                        type: string
                        description: >-
                          字段类型：INTEGER, LONG, FLOAT, DOUBLE, BOOLEAN, DATETIME,
                          STRING
                      displayName:
                        type: string
                        description: 显示名
                      remark:
                        type: string
                        description: 备注
                      maxLen:
                        type: integer
                        description: 最大长度(string字段类型生效)
                        format: int32
                    required:
                      - name
                      - type
                  description: 字段定义
                extendProperties:
                  type: object
                  properties: {}
                  description: 扩展属性 json键值对，最大支持3个
                templateAlias:
                  type: string
                  description: 关联的模板别名
                  maxLength: 63
              required:
                - name
            examples: {}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    format: int32
                    description: 状态码 200-成功 400-参数错误 500-接口异常
                  msg:
                    type: string
                    description: 响应消息
                  data:
                    type: object
                    properties: {}
                    description: 响应数据
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
  /os/open-api/uns/file/detail/{alias}:
    put:
      summary: 修改文件
      deprecated: false
      description: 修改文件信息
      operationId: updateFieldAndDesc
      tags:
        - 文件夹/文件管理
      parameters:
        - name: alias
          in: path
          description: ''
          required: true
          schema:
            type: string
            maxLength: 63
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                definition:
                  type: array
                  description: 字段定义
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 字段名：字母开头，支持字母、数字和下划线 最长63
                        minLength: 1
                        maxLength: 63
                      type:
                        type: string
                        description: >-
                          字段类型：INTEGER, LONG, FLOAT, DOUBLE, BOOLEAN, DATETIME,
                          STRING
                      displayName:
                        type: string
                        description: 显示名
                        maxLength: 255
                      remark:
                        type: string
                        description: 备注
                        maxLength: 255
                      maxLen:
                        type: integer
                        description: 最大长度(string字段类型生效)
                        format: int32
                      unit:
                        type: string
                        description: 位号单位
                      upperLimit:
                        type: number
                        description: 里程上限
                      lowerLimit:
                        type: number
                        description: 里程下限
                      decimal:
                        type: integer
                        description: 小数精度位数
                    required:
                      - name
                      - type
                description:
                  type: string
                  description: 描述 最长255
                  maxLength: 255
                persistence:
                  type: boolean
                  description: 是否持久化
                expression:
                  type: string
                  description: >-
                    当dataType=3时可指定表达式，a1表示refers中第一个，a2表示第二个，以此类推。允许为空或无该字段，表示暂无表达式，此时可按照1-时序的特性来处理。
                  maxLength: 255
                frequency:
                  type: string
                  description: 聚合计算频率：当聚合类型时(dataType=6)的计算时间间隔，单位支持：秒:s 分钟:m 小时：h；如三分钟：3m
                  maxLength: 255
                refers:
                  type: array
                  description: 引用对象
                  items:
                    type: object
                    properties:
                      alias:
                        type: string
                        description: 引用的文件别名
                        maxLength: 63
                      field:
                        type: string
                        description: 引用的字段  当dataType为计算时，必填
                    required:
                      - alias
                name:
                  type: string
                  description: 文件夹名称，仅支持中文、字母、数字、下划线（_）和连字符（-），最大长度63
                  maxLength: 63
                  minLength: 1
                displayName:
                  type: string
                  description: 显示名 最长128
                  maxLength: 128
                extendProperties:
                  type: object
                  properties: {}
                  description: 扩展属性 最多3个
                  additionalProperties:
                    type: object
                    description: 扩展字段JSON
                  maxProperties: 3
            examples: {}
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
  /os/open-api/uns/folder/detail/{alias}:
    put:
      summary: 修改文件夹
      deprecated: false
      description: 修改文件夹信息
      operationId: updateFolder
      tags:
        - 文件夹/文件管理
      parameters:
        - name: alias
          in: path
          description: 别名
          required: true
          schema:
            type: string
            maxLength: 63
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                definition:
                  type: array
                  description: 字段定义
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                        description: 字段名：字母开头，支持字母、数字和下划线 最长63
                        minLength: 1
                        maxLength: 63
                      type:
                        type: string
                        description: >-
                          字段类型：INTEGER, LONG, FLOAT, DOUBLE, BOOLEAN, DATETIME,
                          STRING
                      displayName:
                        type: string
                        description: 显示名
                        maxLength: 255
                      remark:
