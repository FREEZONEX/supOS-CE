      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                pathType:
                  type: integer
                  description: |
                    *节点类型。0-文件夹，2-文件
                displayName:
                  type: string
                  description: 文件显示名。最大长度128字符，允许字符保持supOS工厂版一致。
                  maxLength: 128
                name:
                  type: string
                  description: 文件名称，和文件夹显示名一致。
                  minLength: 1
                  maxLength: 63
                alias:
                  type: string
                  description: '*文件别名。最大长度63字符，允许字符包括英文、数字、下划线。'
                  minLength: 1
                  maxLength: 63
                parentAlias:
                  type: string
                  description: 所属父文件夹别名。
                  minLength: 1
                  maxLength: 63
                description:
                  type: string
                  description: 文件描述。
                  maxLength: 255
                templateAlias:
                  type: string
                  description: 模版别名
                  minLength: 1
                  maxLength: 63
                save2db:
                  description: 是否存储历史。当为dataType=7时，无需持久化。
                  type: boolean
                accessLevel:
                  type: string
                  description: 北向访问级别。READ_ONLY-只读，READ_WRITE-读写。目前暂不支持
                  maxLength: 20
                dataType:
                  type: integer
                  description: >-
                    1-时序，2-关系，3-实时计算，4-历史计算，6-聚合，7-引用。为1/3时supOS系统默认创建"value"，"timeStamp"，"status"三个键。其中value的数据类型要和文件数据类型一致。
                valueType:
                  type: string
                  description: 当dataType=1/3时可指定时序数据值类型。
                  maxLength: 20
                initValue:
                  type: number
                  description: 当dataType=1/3时可以为该文件设置初值。创建该文件后即将此值作为value的初值
                strMaxLen:
                  description: 当valueType=STRING时，可以设置该参数。默认512字符。
                  type: integer
                refers:
                  type: array
                  items:
                    type: object
                    properties:
                      alias:
                        type: string
                        description: 引用的文件别名
                        minLength: 1
                        maxLength: 63
                      field:
                        type: string
                        description: 引用的字段
                        minLength: 1
                        maxLength: 63
                      variableName:
                        type: string
                        description: 计算文件使用的变量名，按a1、a2依次顺延
                        maxLength: 32
                    required:
                      - alias
                      - field
                  description: >-
                    当dataType=3时可指定表达式中使用到的文件别名和field名称。当dataType=7时可指定引用源文件别名，仅第一个有效，不可设置为引用类型文件别名，避免循环引用
                expression:
                  type: string
                  description: >-
                    当dataType=3时可指定表达式，a1表示refers中第一个，a2表示第二个，以此类推。允许为空或无该字段，表示暂无表达式，此时可按照1-时序的特性来处理。
                  maxLength: 255
                extend:
                  type: object
                  properties:
                    k1:
                      type: string
                    k2:
                      type: string
                  description: 扩展Attributes键值对
                  required:
                    - k1
                    - k2
                  maxProperties: 3
              required:
                - name
                - alias
                - pathType
            examples:
              '1':
                value: ''
                summary: 修改文件
              '2':
                value: "{\r\n    \"pathType\": 0, //*节点类型。0-文件夹，2-文件\r\n    \"displayName\": \"AI0001\" //文件夹显示名。最大长度128字符，允许字符保持supOS工厂版一致。\r\n        \"name\": \"AI0001\", //文件夹名，和文件夹显示名一致。\r\n    \"alias\": \"SXXXXXXXXXXX\", //*文件夹别名。最大长度63字符，允许字符包括英文、数字、下划线。\r\n    \"parentAlias\": \"SXXXXXXXXX\", //所属父文件夹别名。\r\n    \"description\": \"\", //文件夹描述。\r\n    \"extend\": { //文件夹扩展Attributes\r\n        \"k1\": \"v1\", //扩展Attributes键值对\r\n        \"k2\": \"v2\"\r\n    }\r\n}"
                summary: 修改文件夹
      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVOObject'
          headers: {}
        '400':
          description: Bad Request
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
        '405':
          description: Method Not Allowed
          content:
            '*/*':
              schema:
                $ref: '#/components/schemas/ResultVO'
          headers: {}
      security: []
