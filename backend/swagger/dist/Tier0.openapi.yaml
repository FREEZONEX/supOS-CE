components:
  schemas:
    ResultVO:
      type: object
      properties:
        code:
          type: integer
          format: int32
          description: 状态码 200-成功 400-参数错误 500-接口异常
        msg:
          type: string
          description: 响应消息
        data:
          type: object
          properties: {}
          description: 响应数据
    FieldDefine:
      required:
        - name
        - type
      type: object
      properties:
        name:
          type: string
          description: 字段名：字母开头，支持字母、数字和下划线，最长63
        type:
          type: string
          description: 字段类型：INTEGER, LONG, FLOAT, DOUBLE, BOOLEAN, DATETIME, STRING
        unique:
          type: boolean
          description: 是否唯一约束，新建模板时，此参数不生效
        index:
          type: string
          description: 对应的协议字段key，新建模板时，此参数不生效
        displayName:
          type: string
          description: 显式名
        remark:
          type: string
          description: 备注
        maxLen:
          type: integer
          description: 最大长度(string字段类型生效)
          format: int32
        systemField:
          type: boolean
          description: 是否系统参数，新建模板时，此参数不生效
      description: 新增的字段
  responses: {}
  securitySchemes:
    apikey-header-apikey:
      type: apiKey
      in: header
      name: apikey
servers: []
security: []
