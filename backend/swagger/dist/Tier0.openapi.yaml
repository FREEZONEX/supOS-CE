      responses:
        '200':
          description: OK
          content:
            '*/*':
              schema:
                type: object
                properties:
                  code:
                    type: integer
                    description: 错误码，0--正常，其他失败
                    format: int32
                  msg:
                    type: string
                    description: 错误信息
                  data:
                    type: object
                    properties:
                      id:
                        type: string
                        description: 文件ID
                      name:
                        type: string
                        description: 文件名
                      displayName:
                        type: string
                        description: 显示名
                      alias:
                        type: string
                        description: 别名
                      parentAlias:
                        type: string
                        description: 父级别名
                      path:
                        type: string
                        description: 全路径
                      dataType:
                        type: integer
                        description: 1--时序，2--关系，3--计算型, 6--聚合 7--引用
                        format: int32
                      parentDataType:
                        type: integer
                        description: >-
                          文件分类类型：1-状态/结果 2-操作
                          3-指标/度量，当环境变量ENABLE_AUTO_CATEGORIZATION为true时有效;dataType与parentDataType对应关系：关系型-状态/结果，时序型-指标/度量，JSONB-操作，其他类型-状态/结果或指标/度量，默认为状态/结果
                      pathType:
                        type: integer
