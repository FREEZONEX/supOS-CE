                      templateAlias:
                        type: string
                        description: 关联的模板别名
                      updateTime:
                        type: integer
                        description: 修改时间--单位：毫秒
                        format: int64
                      createTime:
                        type: integer
                        description: 创建时间--单位：毫秒
                        format: int64
